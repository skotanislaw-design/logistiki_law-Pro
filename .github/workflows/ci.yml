name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest
        env:
          MONGO_URL: mongomock://
          DB_NAME: nomos_ci
          JWT_SECRET: ci-secret-key-with-enough-entropy-for-hs256
          STORAGE_BACKEND: local
          AUTOPILOT_SCHEDULER: "0"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      # Οι ευπάθειες είχαν μπαλωθεί χειροκίνητα μέσω resolutions και είχαν παλιώσει σιωπηλά:
      # κάποιες καρφωμένες εκδόσεις ήταν ακριβώς οι ευάλωτες. Το φράγμα μετατρέπει το
      # «τα διορθώσαμε κάποτε» σε «θα το μάθουμε όταν ξαναεμφανιστούν».
      - run: yarn audit --level high
      - run: yarn build
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: ""
