name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # Τα tests υποδομής (tests/test_unit_nginx_lab_r5.py) τρέχουν τον ΠΡΑΓΜΑΤΙΚΟ nginx με το frontend/nginx.conf μπροστά από
      # backend με τις παραμέτρους του Dockerfile. Η εικόνα ubuntu-latest συνήθως τον έχει ήδη· αλλιώς εγκαθίσταται εδώ.
      - run: command -v nginx || /usr/sbin/nginx -v || (sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx-light)
        working-directory: .
      - run: python -m pytest
        env:
          MONGO_URL: mongomock://
          DB_NAME: nomos_ci
          JWT_SECRET: ci-secret-key-with-enough-entropy-for-hs256
          STORAGE_BACKEND: local
          AUTOPILOT_SCHEDULER: "0"
          # Στο CI τα tests του nginx ΔΕΝ παραλείπονται σιωπηλά: αν λείπει ο nginx, αποτυγχάνουν.
          REQUIRE_NGINX_LAB: "1"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      # Οι ευπάθειες είχαν μπαλωθεί χειροκίνητα μέσω resolutions και είχαν παλιώσει σιωπηλά:
      # κάποιες καρφωμένες εκδόσεις ήταν ακριβώς οι ευάλωτες. Το φράγμα μετατρέπει το
      # «τα διορθώσαμε κάποτε» σε «θα το μάθουμε όταν ξαναεμφανιστούν».
      - run: yarn audit --level high
      # Το eslint ήταν εγκατεστημένο χωρίς ρυθμίσεις (#42)· τώρα πιάνει άγνωστες μεταβλητές, παραβιάσεις των κανόνων των
      # hooks και αχρησιμοποίητο κώδικα, και δεν δέχεται νέες προειδοποιήσεις.
      - run: yarn lint
      # Πρώτα tests στο frontend: μέχρι τώρα το CI επαλήθευε μόνο ότι ο κώδικας
      # μεταγλωττίζεται, όχι ότι κάνει κάτι σωστό.
      - run: yarn test
      - run: yarn build
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: ""
