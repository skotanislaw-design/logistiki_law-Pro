# ---------------------------------------------------------------------------------------------------------
# Access log χωρίς διαπιστευτήρια
#
# Το token της πύλης πελάτη ταξιδεύει μέσα στη διαδρομή (/portal/<token>, /api/portal/<token>/…) και ισχύει 30 ημέρες· ο
# σύνδεσμος επαναφοράς κωδικού φέρει το δικό του token στο query (/reset-password?token=…). Το προεπιλεγμένο access log θα τα
# έγραφε ολόκληρα, και τα logs αρχειοθετούνται ή προωθούνται σε τρίτες υπηρεσίες. Εδώ η διαδρομή καταγράφεται ΧΩΡΙΣ το token
# της πύλης και χωρίς query, και χωρίς Referer (στο ίδιο origin περιέχει ολόκληρο τον σύνδεσμο της πύλης).
# Το `map` και το `log_format` ανήκουν στο επίπεδο http: το αρχείο αυτό μπαίνει στο /etc/nginx/conf.d/ (βλ. frontend/Dockerfile),
# που ο nginx το συμπεριλαμβάνει μέσα στο `http { … }`. Το `access_log` του server παρακάτω ΑΝΤΙΚΑΘΙΣΤΑ αυτό του http.
# Το error log μπορεί να περιέχει ολόκληρο το URL σε περίπτωση σφάλματος: κρατήστε το ιδιωτικό.
map $request_uri $logged_uri {
    ~^(?<before>/(?:api/)?portal/)[^/?]+(?<after>[^?]*)   "${before}[token]${after}";
    ~^(?<plain>[^?]*)                                      $plain;
    default                                                $request_uri;
}

log_format redacted '$remote_addr [$time_local] "$request_method $logged_uri $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log redacted;

    # Κεφαλίδες ασφαλείας.
    #
    # Το portal token ταξιδεύει μέσα στη διαδρομή του URL (/portal/<token>) και η σελίδα
    # φορτώνει πόρους από τρίτα origins (Google Fonts). Η Referrer-Policy εμποδίζει τη
    # μεταφορά ολόκληρου του URL σε αυτά. Δεν διορθώνει ενεργή διαρροή — οι σύγχρονοι
    # browsers στέλνουν ήδη μόνο το origin σε cross-origin αιτήματα· είναι άμυνα σε βάθος
    # για παλαιότερους πελάτες και για ό,τι προστεθεί στη σελίδα αργότερα.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets — long cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Επανάληψη: ένα location με δικό του add_header δεν κληρονομεί του server.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Service worker — no cache
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # SPA fallback — όλες οι διαδρομές στο index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------------------------------------
    # API reverse proxy
    #
    # Διεύθυνση πελάτη (X-Forwarded-For). Το backend τρέχει με `uvicorn --proxy-headers --forwarded-allow-ips "*"`
    # και παίρνει ως IP του πελάτη το ΑΡΙΣΤΕΡΟ στοιχείο της κεφαλίδας. Γι' αυτό ο nginx την ΞΑΝΑΓΡΑΦΕΙ με τη
    # διεύθυνση της σύνδεσης ($remote_addr) αντί να προσθέτει στο τέλος ($proxy_add_x_forwarded_for): ό,τι έστελνε
    # ο πελάτης θα έμενε αριστερά και θα θεωρούνταν η IP του — με νέα τιμή σε κάθε αίτημα ακυρώνονται το όριο ρυθμού
    # της πύλης, τα κλειδώματα σύνδεσης/2FA και η IP στο ελεγκτικό ίχνος και στις ψηφιακές υπογραφές.
    # Προϋπόθεση: ο nginx είναι η ΜΟΝΗ είσοδος προς το backend (στο docker-compose το backend δεν δημοσιεύει θύρα).
    #
    # Αν μπροστά από αυτόν τον nginx υπάρχει άλλος reverse proxy ή load balancer (Cloudflare, AWS ALB, Traefik, …),
    # το $remote_addr είναι η διεύθυνσή του και ΟΛΟΙ οι πελάτες θα φαίνονταν ως μία IP (το όριο ανά IP της πύλης
    # γίνεται κοινό για όλους). Τότε ορίστε την πραγματική IP ρητά, μόνο από τη γνωστή διεύθυνση εκείνου του proxy,
    # πάνω από το πρώτο location:
    #
    #     set_real_ip_from  <διεύθυνση ή δίκτυο του εξωτερικού proxy>;
    #     real_ip_header    X-Forwarded-For;
    #     real_ip_recursive on;
    #
    # Το `^~` εμποδίζει τον κανόνα των στατικών αρχείων (κανονική έκφραση) να "κλέψει" κλήσεις του API που τελειώνουν
    # σε .png, .js, .css κ.λπ.
    location ^~ /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }

    # Αντίγραφα ασφαλείας. Το backend δέχεται αρχείο έως 100 MB (MAX_UPLOAD_BYTES στο routes_backup.py) και εξηγεί με
    # σαφές μήνυμα όποιο όριο ξεπεραστεί· με 20 MB εδώ, ένα μεγαλύτερο αντίγραφο έφτανε ως σελίδα σφάλματος του nginx.
    # Η εξαγωγή χτίζεται ολόκληρη πριν σταλεί το πρώτο byte και η επαναφορά γράφει χιλιάδες έγγραφα: χρειάζονται χρόνο.
    # Κρατήστε το client_max_body_size πάνω από το MAX_UPLOAD_BYTES (το επαληθεύει το tests/test_unit_deploy_r5.py).
    location ^~ /api/backup/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110M;
        proxy_read_timeout 300s;
    }

    # Η σελίδα της πύλης πελάτη (/portal/<token>, ο σύνδεσμος του email) εξυπηρετείται από το SPA μέσω του
    # `location /` παραπάνω. Παλιότερα εδώ υπήρχε `location /portal/ { proxy_pass …/api/portal/; }`: ο browser που
    # άνοιγε τον σύνδεσμο έπαιρνε JSON αντί για σελίδα. Τα δεδομένα της πύλης διαβάζει το SPA από το /api/portal/….
}
