server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Κεφαλίδες ασφαλείας.
    #
    # Το portal token ταξιδεύει μέσα στη διαδρομή του URL (/portal/<token>) και η σελίδα
    # φορτώνει πόρους από τρίτα origins (Google Fonts). Η Referrer-Policy εμποδίζει τη
    # μεταφορά ολόκληρου του URL σε αυτά. Δεν διορθώνει ενεργή διαρροή — οι σύγχρονοι
    # browsers στέλνουν ήδη μόνο το origin σε cross-origin αιτήματα· είναι άμυνα σε βάθος
    # για παλαιότερους πελάτες και για ό,τι προστεθεί στη σελίδα αργότερα.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets — long cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Επανάληψη: ένα location με δικό του add_header δεν κληρονομεί του server.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Service worker — no cache
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # SPA fallback — όλες οι διαδρομές στο index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }

    # Stripe webhook / public portal endpoints (ίδιο prefix pattern με /portal/ και /api/stripe/webhook)
    location /portal/ {
        proxy_pass http://backend:8001/api/portal/;
        proxy_set_header Host $host;
    }
}
