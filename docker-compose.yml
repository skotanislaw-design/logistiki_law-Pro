services:
  mongo:
    image: mongo:7
    container_name: nomos-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-nomos_one}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nomos}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?ορίστε MONGO_PASSWORD στο .env}
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER:-nomos}", "-p", "${MONGO_PASSWORD}",
             "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nomos-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://${MONGO_USER:-nomos}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      DB_NAME: "${DB_NAME:-nomos_one}"
      JWT_SECRET: "${JWT_SECRET}"
      SECRETS_KEY: "${SECRETS_KEY:-}"
      EMERGENT_LLM_KEY: "${EMERGENT_LLM_KEY}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      STRIPE_MODE: "${STRIPE_MODE:-test}"
      PUBLIC_URL: "${PUBLIC_URL}"
      CORS_ORIGINS: "${CORS_ORIGINS:-${PUBLIC_URL}}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@logistiki.gr}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      AUTOPILOT_SCHEDULER: "${AUTOPILOT_SCHEDULER:-0}"
      BACKUP_DIR: /app/backups
      AUTOPILOT_INTERVAL_MINUTES: "${AUTOPILOT_INTERVAL_MINUTES:-15}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      UPLOAD_DIR: /app/uploads
      MYDATA_MOCK: "${MYDATA_MOCK:-0}"
    volumes:
      - uploaded_files:/app/uploads
      - ./backups:/app/backups

  # Autopilot: μία διεργασία για όλες τις προγραμματισμένες εργασίες, ώστε τα replicas
  # του API να μην τις τρέχουν παράλληλα.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nomos-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://${MONGO_USER:-nomos}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      DB_NAME: "${DB_NAME:-nomos_one}"
      JWT_SECRET: "${JWT_SECRET}"
      SECRETS_KEY: "${SECRETS_KEY:-}"
      EMERGENT_LLM_KEY: "${EMERGENT_LLM_KEY}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      PUBLIC_URL: "${PUBLIC_URL}"
      AUTOPILOT_INTERVAL_MINUTES: "${AUTOPILOT_INTERVAL_MINUTES:-15}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      MYDATA_MOCK: "${MYDATA_MOCK:-0}"
    volumes:
      - uploaded_files:/app/uploads
      - ./backups:/app/backups

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: "${PUBLIC_URL}"
    container_name: nomos-frontend
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      - backend

  # Optional — nightly Mongo backup to ./backups
  backup:
    image: mongo:7
    container_name: nomos-backup
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      DB_NAME: "${DB_NAME:-nomos_one}"
      MONGO_USER: "${MONGO_USER:-nomos}"
      MONGO_PASSWORD: "${MONGO_PASSWORD:?ορίστε MONGO_PASSWORD στο .env}"
    entrypoint: >
      sh -c 'while true; do
        echo "Starting daily backup at $$(date)";
        mongodump --host mongo --db $$DB_NAME
          --username "$$MONGO_USER" --password "$$MONGO_PASSWORD" --authenticationDatabase admin
          --archive=/backups/nomos-$$(date +%Y%m%d-%H%M%S).archive --gzip;
        find /backups -name "nomos-*.archive" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  mongo_data:
  uploaded_files:
