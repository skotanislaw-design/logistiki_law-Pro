[pytest]
# Offline unit tests (tests/test_unit_*.py) run against an in-memory Mongo and need no services.
# The legacy E2E suites (backend_test.py, test_phase_a.py, …) expect a live deployment and are
# selected explicitly, e.g. `pytest tests/test_phase_a.py`.
testpaths = tests
python_files = test_unit_*.py
asyncio_mode = auto
addopts = -q
